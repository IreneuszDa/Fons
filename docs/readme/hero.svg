<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b1f1d"/><stop offset=".55" stop-color="#493734"/><stop offset="1" stop-color="#7a5a4f"/></linearGradient>
<radialGradient id="glow" cx=".8" cy=".3" r=".6"><stop offset="0" stop-color="#25d366" stop-opacity=".28"/><stop offset="1" stop-color="#25d366" stop-opacity="0"/></radialGradient>
<style>
.r{fill:none;stroke:#fcfbfa;stroke-opacity:.35;transform-origin:930px 210px;animation:ring 3.6s ease-out infinite}
.r2{animation-delay:1.2s}.r3{animation-delay:2.4s}
@keyframes ring{0%{transform:scale(.4);stroke-opacity:.6}100%{transform:scale(2.4);stroke-opacity:0}}
.chip{animation:float 5s ease-in-out infinite}
.c2{animation-delay:-1.6s}.c3{animation-delay:-3.2s}.c4{animation-delay:-2.4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.type{stroke-dasharray:480;stroke-dashoffset:480;animation:t 6s ease-in-out infinite}
@keyframes t{0%{stroke-dashoffset:480}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
</style></defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#glow)"/>
<g opacity=".06" stroke="#fff"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/><path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/></g>
<text x="70" y="150" fill="#fcfbfa" font-family="Georgia,'Times New Roman',serif" font-size="96" letter-spacing="-2">Fons</text>
<text x="74" y="200" fill="#f1e7df" font-size="30" font-weight="600">Sprawdź informację u źródła.</text>
<text x="74" y="244" fill="#e3d4c9" font-size="19">Wklej plotkę, link, zrzut ekranu, nagranie albo film z TikToka.</text>
<text x="74" y="272" fill="#e3d4c9" font-size="19">Dostajesz werdykt z dosłownym cytatem i linkiem — w czacie WWW i na WhatsAppie.</text>
<g transform="translate(74 310)">
 <rect width="200" height="44" rx="22" fill="#25d366"/><text x="100" y="28" text-anchor="middle" fill="#06301a" font-weight="700" font-size="16">💬 Działa na WhatsAppie</text>
 <rect x="214" width="178" height="44" rx="22" fill="none" stroke="#fcfbfa" stroke-opacity=".5"/><text x="303" y="28" text-anchor="middle" fill="#fcfbfa" font-weight="600" font-size="16">🔎 Cytat = dowód</text>
 <rect x="406" width="196" height="44" rx="22" fill="none" stroke="#fcfbfa" stroke-opacity=".5"/><text x="504" y="28" text-anchor="middle" fill="#fcfbfa" font-weight="600" font-size="16">🛡️ Odporny na injection</text>
</g>
<circle class="r" cx="930" cy="210" r="70" stroke-width="2"/><circle class="r r2" cx="930" cy="210" r="70" stroke-width="2"/><circle class="r r3" cx="930" cy="210" r="70" stroke-width="2"/>
<circle cx="930" cy="210" r="62" fill="#fcfbfa"/>
<text x="930" y="236" text-anchor="middle" fill="#493734" font-family="Georgia,serif" font-size="74">F</text>
<g class="chip"><rect x="700" y="70" width="190" height="42" rx="21" fill="#e6f4ea"/><text x="795" y="97" text-anchor="middle" fill="#14532d" font-weight="700" font-size="16">✅ Potwierdzone</text></g>
<g class="chip c2"><rect x="1000" y="92" width="160" height="42" rx="21" fill="#fde2e1"/><text x="1080" y="119" text-anchor="middle" fill="#7f1d1d" font-weight="700" font-size="16">❌ Fałszywe</text></g>
<g class="chip c3"><rect x="985" y="300" width="190" height="42" rx="21" fill="#fdf0c8"/><text x="1080" y="327" text-anchor="middle" fill="#713f12" font-weight="700" font-size="15">⚠️ Wprowadza w błąd</text></g>
<g class="chip c4"><rect x="700" y="364" width="200" height="42" rx="21" fill="#ece7e3"/><text x="800" y="391" text-anchor="middle" fill="#493734" font-weight="700" font-size="15">❔ Brak dowodów</text></g>
</svg>
