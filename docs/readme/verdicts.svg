<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>.p{animation:pp 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pp{0%,100%{transform:scale(1)}8%{transform:scale(1.06)}16%{transform:scale(1)}}</style>
<rect width="1200" height="230" rx="24" fill="#fcfbfa"/>
<text x="30" y="44" font-size="20" font-weight="700" fill="#2b1f1d">Pięć uczciwych werdyktów</text>
<text x="30" y="68" font-size="13.5" fill="#7a6a63">Werdykt liczą jawne reguły w kodzie. Osobno status techniczny: OK · NIEPEŁNE · AWARIA · DOPRECYZUJ · POZA ZAKRESEM.</text>
<g class="p"><rect x="30" y="92" width="214" height="110" rx="18" fill="#e6f4ea"/><text x="52" y="134" font-size="26">✅</text><text x="52" y="164" font-size="17" font-weight="800" fill="#14532d">Potwierdzone</text><text x="52" y="186" font-size="11.5" fill="#14532d">wiarygodne źródła mówią to samo</text></g>
<g class="p" style="animation-delay:1.2s"><rect x="258" y="92" width="214" height="110" rx="18" fill="#fde2e1"/><text x="280" y="134" font-size="26">❌</text><text x="280" y="164" font-size="17" font-weight="800" fill="#7f1d1d">Fałszywe</text><text x="280" y="186" font-size="11.5" fill="#7f1d1d">źródła przeczą informacji</text></g>
<g class="p" style="animation-delay:2.4s"><rect x="486" y="92" width="214" height="110" rx="18" fill="#fdf0c8"/><text x="508" y="134" font-size="26">⚠️</text><text x="508" y="164" font-size="17" font-weight="800" fill="#713f12">Wprowadzające w błąd</text><text x="508" y="186" font-size="11.5" fill="#713f12">zły kontekst albo nieaktualne</text></g>
<g class="p" style="animation-delay:3.6s"><rect x="714" y="92" width="214" height="110" rx="18" fill="#ece7e3"/><text x="736" y="134" font-size="26">❔</text><text x="736" y="164" font-size="17" font-weight="800" fill="#493734">Brak dowodów</text><text x="736" y="186" font-size="11.5" fill="#493734">Fons nie zgaduje z pamięci</text></g>
<g class="p" style="animation-delay:4.8s"><rect x="942" y="92" width="228" height="110" rx="18" fill="#e5edff"/><text x="964" y="134" font-size="26">💭</text><text x="964" y="164" font-size="17" font-weight="800" fill="#1e3a8a">Nie podlega weryfikacji</text><text x="964" y="186" font-size="11.5" fill="#1e3a8a">opinia, ocena, przyszłość</text></g>
</svg>
