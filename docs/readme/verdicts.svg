<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">

<rect width="1200" height="230" rx="24" fill="#fcfbfa"/>
<text x="30" y="44" font-size="20" font-weight="700" fill="#2b1f1d">Jak czytać ocenę twierdzenia</text>
<text x="30" y="68" font-size="13.5" fill="#7a6a63">Każda ocena odnosi się do konkretnej tezy i dostępnych dowodów.</text>
<g><rect x="30" y="92" width="214" height="110" rx="18" fill="#e6f4ea"/><text x="52" y="134" font-size="26">✅</text><text x="52" y="164" font-size="15" font-weight="800" fill="#14532d">Potwierdzone</text><text x="52" y="186" font-size="11.5" fill="#14532d">dowody potwierdzają tezę</text></g>
<g><rect x="258" y="92" width="214" height="110" rx="18" fill="#fde2e1"/><text x="280" y="134" font-size="26">❌</text><text x="280" y="164" font-size="15" font-weight="800" fill="#7f1d1d">Fałszywe</text><text x="280" y="186" font-size="11.5" fill="#7f1d1d">źródła przeczą informacji</text></g>
<g><rect x="486" y="92" width="214" height="110" rx="18" fill="#fdf0c8"/><text x="508" y="134" font-size="26">⚠️</text><text x="508" y="164" font-size="15" font-weight="800" fill="#713f12">Wprowadzające w błąd</text><text x="508" y="186" font-size="11.5" fill="#713f12">np. błędny kontekst lub data</text></g>
<g><rect x="714" y="92" width="214" height="110" rx="18" fill="#ece7e3"/><text x="736" y="123" font-size="26">❔</text><text x="736" y="164" font-size="15" font-weight="800" fill="#493734"><tspan x="736" dy="-14">Brak wystarczających</tspan><tspan x="736" dy="19">dowodów</tspan></text><text x="736" y="186" font-size="11.5" fill="#493734">źródła nie rozstrzygają tezy</text></g>
<g><rect x="942" y="92" width="228" height="110" rx="18" fill="#e5edff"/><text x="964" y="134" font-size="26">💭</text><text x="964" y="164" font-size="15" font-weight="800" fill="#1e3a8a">Nie podlega weryfikacji</text><text x="964" y="186" font-size="11.5" fill="#1e3a8a">np. opinia lub prognoza</text></g>
</svg>
