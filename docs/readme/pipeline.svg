<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>
.card{animation:lit 9s linear infinite}
@keyframes lit{0%,100%{fill:#fffdfb;stroke:#e6dcd5}4%,10%{fill:#493734;stroke:#493734}14%{fill:#fffdfb;stroke:#e6dcd5}}
.lab{animation:litt 9s linear infinite}@keyframes litt{0%,100%{fill:#2b1f1d}4%,10%{fill:#fcfbfa}14%{fill:#2b1f1d}}
.sub{animation:lits 9s linear infinite}@keyframes lits{0%,100%{fill:#7a6a63}4%,10%{fill:#e9dcd3}14%{fill:#7a6a63}}
.flow{stroke-dasharray:6 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
</style>
<rect width="1200" height="360" rx="24" fill="#fcfbfa"/>
<text x="30" y="46" font-size="22" font-weight="700" fill="#2b1f1d">Jak pytanie staje się odpowiedzią</text>
<text x="30" y="72" font-size="14" fill="#7a6a63">Orkiestratorem jest kod — żaden model nie dostaje jednocześnie treści niezaufanej i narzędzi.</text>
<line x1="40" y1="200" x2="1160" y2="200" stroke="#c9b8ad" stroke-width="2" class="flow"/>
<g><rect class="card" style="animation-delay:0.00s" fill="#fffdfb" stroke="#e6dcd5" x="30.0" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="89.0" y="166" text-anchor="middle" font-size="30">💬</text>
<text class="lab" style="animation-delay:0.00s" fill="#2b1f1d" x="89.0" y="200" text-anchor="middle" font-size="13" font-weight="700">Wiadomość</text>
<text class="sub" style="animation-delay:0.00s" fill="#7a6a63" x="89.0" y="226" text-anchor="middle" font-size="11.5">tekst · link · obraz</text>
<text class="sub" style="animation-delay:0.00s" fill="#7a6a63" x="89.0" y="244" text-anchor="middle" font-size="11.5">głos · wideo · PDF</text>
<text x="89.0" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">01</text></g>
<g><rect class="card" style="animation-delay:1.00s" fill="#fffdfb" stroke="#e6dcd5" x="157.8" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="216.8" y="166" text-anchor="middle" font-size="30">🧹</text>
<text class="lab" style="animation-delay:1.00s" fill="#2b1f1d" x="216.8" y="200" text-anchor="middle" font-size="13" font-weight="700">Normalizacja</text>
<text class="sub" style="animation-delay:1.00s" fill="#7a6a63" x="216.8" y="226" text-anchor="middle" font-size="11.5">maskowanie PII</text>
<text class="sub" style="animation-delay:1.00s" fill="#7a6a63" x="216.8" y="244" text-anchor="middle" font-size="11.5">ochrona SSRF</text>
<text x="216.8" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">02</text></g>
<g><rect class="card" style="animation-delay:2.00s" fill="#fffdfb" stroke="#e6dcd5" x="285.5" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="344.5" y="166" text-anchor="middle" font-size="30">🛡️</text>
<text class="lab" style="animation-delay:2.00s" fill="#2b1f1d" x="344.5" y="200" text-anchor="middle" font-size="13" font-weight="700">Detektor ataków</text>
<text class="sub" style="animation-delay:2.00s" fill="#7a6a63" x="344.5" y="226" text-anchor="middle" font-size="11.5">PL/EN/RU/UA</text>
<text class="sub" style="animation-delay:2.00s" fill="#7a6a63" x="344.5" y="244" text-anchor="middle" font-size="11.5">homoglify · base64</text>
<text x="344.5" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">03</text></g>
<g><rect class="card" style="animation-delay:3.00s" fill="#fffdfb" stroke="#e6dcd5" x="413.2" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="472.2" y="166" text-anchor="middle" font-size="30">✂️</text>
<text class="lab" style="animation-delay:3.00s" fill="#2b1f1d" x="472.2" y="200" text-anchor="middle" font-size="13" font-weight="700">Twierdzenia</text>
<text class="sub" style="animation-delay:3.00s" fill="#7a6a63" x="472.2" y="226" text-anchor="middle" font-size="11.5">szybki model</text>
<text class="sub" style="animation-delay:3.00s" fill="#7a6a63" x="472.2" y="244" text-anchor="middle" font-size="11.5">tryb pytania</text>
<text x="472.2" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">04</text></g>
<g><rect class="card" style="animation-delay:4.00s" fill="#fffdfb" stroke="#e6dcd5" x="541.0" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="600.0" y="166" text-anchor="middle" font-size="30">🔎</text>
<text class="lab" style="animation-delay:4.00s" fill="#2b1f1d" x="600.0" y="200" text-anchor="middle" font-size="13" font-weight="700">Wyszukiwanie</text>
<text class="sub" style="animation-delay:4.00s" fill="#7a6a63" x="600.0" y="226" text-anchor="middle" font-size="11.5">BM25 + wektory e5</text>
<text class="sub" style="animation-delay:4.00s" fill="#7a6a63" x="600.0" y="244" text-anchor="middle" font-size="11.5">RRF + rerank</text>
<text x="600.0" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">05</text></g>
<g><rect class="card" style="animation-delay:5.00s" fill="#fffdfb" stroke="#e6dcd5" x="668.8" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="727.8" y="166" text-anchor="middle" font-size="30">⚖️</text>
<text class="lab" style="animation-delay:5.00s" fill="#2b1f1d" x="727.8" y="200" text-anchor="middle" font-size="13" font-weight="700">Ocena dowodów</text>
<text class="sub" style="animation-delay:5.00s" fill="#7a6a63" x="727.8" y="226" text-anchor="middle" font-size="11.5">model główny</text>
<text class="sub" style="animation-delay:5.00s" fill="#7a6a63" x="727.8" y="244" text-anchor="middle" font-size="11.5">tylko fragmenty</text>
<text x="727.8" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">06</text></g>
<g><rect class="card" style="animation-delay:6.00s" fill="#fffdfb" stroke="#e6dcd5" x="796.5" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="855.5" y="166" text-anchor="middle" font-size="30">🔬</text>
<text class="lab" style="animation-delay:6.00s" fill="#2b1f1d" x="855.5" y="200" text-anchor="middle" font-size="13" font-weight="700">Kontrola cytatów</text>
<text class="sub" style="animation-delay:6.00s" fill="#7a6a63" x="855.5" y="226" text-anchor="middle" font-size="11.5">dosłowny podciąg</text>
<text class="sub" style="animation-delay:6.00s" fill="#7a6a63" x="855.5" y="244" text-anchor="middle" font-size="11.5">2. model weryfikuje</text>
<text x="855.5" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">07</text></g>
<g><rect class="card" style="animation-delay:7.00s" fill="#fffdfb" stroke="#e6dcd5" x="924.2" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="983.2" y="166" text-anchor="middle" font-size="30">📐</text>
<text class="lab" style="animation-delay:7.00s" fill="#2b1f1d" x="983.2" y="200" text-anchor="middle" font-size="13" font-weight="700">Reguły werdyktu</text>
<text class="sub" style="animation-delay:7.00s" fill="#7a6a63" x="983.2" y="226" text-anchor="middle" font-size="11.5">reguły 1–9 w kodzie</text>
<text class="sub" style="animation-delay:7.00s" fill="#7a6a63" x="983.2" y="244" text-anchor="middle" font-size="11.5">nie model</text>
<text x="983.2" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">08</text></g>
<g><rect class="card" style="animation-delay:8.00s" fill="#fffdfb" stroke="#e6dcd5" x="1052.0" y="120" width="118" height="160" rx="16" stroke-width="1.5"/>
<text x="1111.0" y="166" text-anchor="middle" font-size="30">✅</text>
<text class="lab" style="animation-delay:8.00s" fill="#2b1f1d" x="1111.0" y="200" text-anchor="middle" font-size="13" font-weight="700">Odpowiedź</text>
<text class="sub" style="animation-delay:8.00s" fill="#7a6a63" x="1111.0" y="226" text-anchor="middle" font-size="11.5">cytat + link + data</text>
<text class="sub" style="animation-delay:8.00s" fill="#7a6a63" x="1111.0" y="244" text-anchor="middle" font-size="11.5">raport /w/:token</text>
<text x="1111.0" y="300" text-anchor="middle" font-size="11" fill="#b3a39a" font-weight="700">09</text></g>
<circle r="7" fill="#25d366"><animateMotion dur="9s" repeatCount="indefinite" path="M40,110 L1160,110"/></circle>
<text x="30" y="336" font-size="13" fill="#7a6a63">Gdy źródła milczą → „Brak wystarczających dowodów”. Awaria techniczna nigdy nie udaje werdyktu.</text>
</svg>