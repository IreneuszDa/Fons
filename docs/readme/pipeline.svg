<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 644" width="1152" height="644"><rect width="1152" height="644" fill="#faf8f4"/><text x="38" y="58" fill="#493a35" font-size="44" font-family="Georgia">Fons</text><text x="175" y="53" fill="#453832" font-size="25" font-family="Arial">Jak pytanie staje się odpowiedzią</text><path d="M38 82H1114" stroke="#cec7bd"/><path d="M263 256 H300 V159 H364 M728 159 H765 V256 H814" fill="none" stroke="#bcb7ab" stroke-width="2"/><rect x="364" y="121" width="364" height="76" rx="12" fill="#fffdfa" stroke="#cfc9bf"/><text x="380" y="154" fill="#453832" font-size="23" font-family="Arial">Pamięć wyników</text><text x="380" y="180" fill="#605e55" font-size="18" font-family="Arial">Jest pasujący raport</text><path d="M263 256 H300 V256 H364 M728 256 H765 V256 H814" fill="none" stroke="#bcb7ab" stroke-width="2"/><rect x="364" y="218" width="364" height="76" rx="12" fill="#fffdfa" stroke="#cfc9bf"/><text x="380" y="251" fill="#453832" font-size="23" font-family="Arial">Rejestr urzędowy</text><text x="380" y="277" fill="#605e55" font-size="18" font-family="Arial">Jest bezpośrednia odpowiedź</text><path d="M263 256 H300 V353 H364 M728 353 H765 V256 H814" fill="none" stroke="#bcb7ab" stroke-width="2"/><rect x="364" y="315" width="364" height="76" rx="12" fill="#fffdfa" stroke="#cfc9bf"/><text x="380" y="348" fill="#453832" font-size="23" font-family="Arial">Wyszukiwanie i ocena</text><text x="380" y="374" fill="#605e55" font-size="18" font-family="Arial">Teza wymaga dowodów</text><rect x="38" y="218" width="225" height="76" rx="12" fill="#e5ebdf" stroke="#6e805e"/><text x="54" y="251" fill="#453832" font-size="23" font-family="Arial">Wiadomość</text><text x="54" y="277" fill="#605e55" font-size="18" font-family="Arial">Pytanie lub teza</text><rect x="814" y="218" width="300" height="76" rx="12" fill="#fffdfa" stroke="#cfc9bf"/><text x="830" y="251" fill="#453832" font-size="23" font-family="Arial">Wynik w czacie</text><text x="830" y="277" fill="#605e55" font-size="18" font-family="Arial">Link do zapisanego raportu</text><path d="M38 430H1114" stroke="#cec7bd"/><text x="38" y="492" fill="#493a35" font-size="38" font-family="Georgia">Jak Fons wybiera sposób sprawdzenia?</text><text x="38" y="548" fill="#453832" font-size="25" font-family="Arial">Dla tej samej wiadomości wystarczy czasem zapisany raport. Nowa teza może</text><text x="38" y="583" fill="#453832" font-size="25" font-family="Arial">wymagać wyszukania dowodów.</text></svg>
