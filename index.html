<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Fons — sprawdź informację u źródła. Wklej tekst, link albo zadaj pytanie, a sprawdzimy je w wiarygodnych źródłach. Prototyp." />
    <meta name="application-name" content="Fons" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Fons — sprawdź informację u źródła" />
    <meta property="og:description" content="Wklej tekst, link albo zadaj pytanie — Fons pokaże, co mówią wiarygodne źródła. Prototyp." />
    <meta name="referrer" content="no-referrer" />
    <title>Fons — sprawdź informację u źródła</title>
    <style>
      .astryx-chat-layout > :has(.astryx-chat-layout-scroll-button) {
        background-color: var(--color-background-surface);
      }
      /* Astryx places its decorative blur immediately after the scroll button wrapper. */
      .astryx-chat-layout :has(> .astryx-chat-layout-scroll-button) + :empty {
        display: none;
      }
      /* Astryx puts its body, attachment drawer and status in separate slots. */
      .fons-composer > :has(> * > .astryx-chat-composer-input) {
        border: var(--border-width) solid var(--color-border);
        box-shadow: 0 var(--border-width) var(--spacing-2) var(--color-border);
        outline-color: var(--color-text-secondary);
        outline-width: var(--border-width);
      }
      .fons-composer[data-inline] > :has(> * > .astryx-chat-composer-input) {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
      }
      .fons-composer[data-inline] :has(> .astryx-chat-composer-input) {
        grid-area: 1 / 2;
      }
      .fons-composer[data-inline] :has(> .astryx-chat-composer-input) + * {
        display: contents;
      }
      .fons-composer[data-inline] :has(> .astryx-chat-composer-input) + * > :first-child {
        grid-area: 1 / 1;
      }
      .fons-composer[data-inline] :has(> .astryx-chat-composer-input) + * > :last-child {
        grid-area: 1 / 3;
      }
      .fons-composer .astryx-chat-composer-input > [aria-hidden="true"] {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <noscript>Ta strona wymaga włączonej obsługi JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
