    "Manipulacja":            { verdict: WPROWADZAJACE, binary: false }
    "Wprowadzające w błąd":   { verdict: WPROWADZAJACE, binary: false }
    "Brak kontekstu":         { verdict: WPROWADZAJACE, binary: false }
    "Nieweryfikowalne":       { verdict: BRAK_DOWODOW, binary: false }
    "Brak dowodów":           { verdict: BRAK_DOWODOW, binary: false }
    "Satyra":                 { verdict: NIE_PODLEGA, binary: false }

  # ---- Stowarzyszenie Pravda (pravda.org.pl) - etykiety zaobserwowane w feedzie ----
  # "Zrealizowane" (obietnica spełniona) i "Fact-Checked" opisują obietnice/status, nie prawdziwość tezy => brak wpisu => null
  pravda_pl:
    "Prawda":                      { verdict: POTWIERDZONE, binary: true }
    "Fałsz":                       { verdict: FALSZYWE, binary: true }
    "Manipulacja":                 { verdict: WPROWADZAJACE, binary: false }
    "Nieweryfikowalne":            { verdict: BRAK_DOWODOW, binary: false }
    "Niedające się zweryfikować":  { verdict: BRAK_DOWODOW, binary: false }

  # ---- Demagog (skala oceny wypowiedzi + skala fake newsów; dane z Google Fact Check Tools API) ----
  # Etykiety kontekstowe i „przerobione” media mapujemy jak w tablicy angielskiej (Missing Context / Altered => WPROWADZAJACE).
  demagog:
    "Prawda":                 { verdict: POTWIERDZONE, binary: true }
    "Przeważnie prawda":      { verdict: POTWIERDZONE, binary: false }
    "Częściowa prawda":       { verdict: WPROWADZAJACE, binary: false }
    "Manipulacja":            { verdict: WPROWADZAJACE, binary: false }
    "Manipulacja kontekstem": { verdict: WPROWADZAJACE, binary: false }
    "Brakujący kontekst":     { verdict: WPROWADZAJACE, binary: false }
    "Brak kontekstu":         { verdict: WPROWADZAJACE, binary: false }
    "Częściowy fałsz":        { verdict: WPROWADZAJACE, binary: false }
    "Przerobione zdjęcie":    { verdict: WPROWADZAJACE, binary: false }
    "Przerobione zdjęcia":    { verdict: WPROWADZAJACE, binary: false }
    "Przerobiony obraz":      { verdict: WPROWADZAJACE, binary: false }
    "Przerobiony film":       { verdict: WPROWADZAJACE, binary: false }
    "Przerobione wideo":      { verdict: WPROWADZAJACE, binary: false }
    "Przerobione nagranie":   { verdict: WPROWADZAJACE, binary: false }
    "Przerobiona grafika":    { verdict: WPROWADZAJACE, binary: false }
    "Częściowo fałszywe":     { verdict: WPROWADZAJACE, binary: false }
    "Przeważnie fałsz":       { verdict: FALSZYWE, binary: false }
    "Fałsz":                  { verdict: FALSZYWE, binary: true }
    "Nieweryfikowalne":       { verdict: BRAK_DOWODOW, binary: false }
    "Satyra":                 { verdict: NIE_PODLEGA, binary: false }

  # ---- AFP Sprawdzam ----
  afp_sprawdzam:
    "Prawda":                  { verdict: POTWIERDZONE, binary: true }
    "Fałsz":                   { verdict: FALSZYWE, binary: true }
    "Fałszywe":                { verdict: FALSZYWE, binary: true }
    "Zmanipulowane":           { verdict: WPROWADZAJACE, binary: false }
    "Wprowadzające w błąd":    { verdict: WPROWADZAJACE, binary: false }
    "Mylące":                  { verdict: WPROWADZAJACE, binary: false }
    "Brak kontekstu":          { verdict: WPROWADZAJACE, binary: false }
