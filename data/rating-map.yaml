    "Brak dowodów":            { verdict: BRAK_DOWODOW, binary: false }

  # ---- EUvsDisinfo: wpis o prefiksie DISINFO to narracja sklasyfikowana jako dezinformacja.
  #      binary: false celowo - zaprzeczenie takiej tezy NIE oznacza, że jest prawdziwa. ----
  euvsdisinfo:
    "DISINFO":   { verdict: FALSZYWE, binary: false }
