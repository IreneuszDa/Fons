# Katalog źródeł Prawdowida (CatalogSource, src/shared/contracts.ts).
#
# Poziom (level) jest przypisany do DOKŁADNEGO hosta: subdomena NIE dziedziczy poziomu domeny nadrzędnej
# (np. "www.dw.com" jest w katalogu, "dw.com" ani "p.dw.com" nie są). Poziom nigdy nie pochodzi
# z odpowiedzi modelu ani konektora.
#
#   level 1 — pierwotne / urzędowe (akty prawne, dane publiczne, komunikaty instytucji)
#   level 2 — fact-check sygnatariusza IFCN/EFCSN albo analiza instytucji publicznej UE/NATO
#   level 3 — wiarygodne źródło wtórne
#
# Pole ifcnEfcsn = true WYŁĄCZNIE gdy organizacja figuruje na oficjalnej liście IFCN
# (ifcncodeofprinciples.poynter.org/signatories, zakładki "Active" lub "In Renewal") albo EFCSN
# (members.efcsn.com/signatories) — stan sprawdzony 2026-11-21, szczegóły i zrzut list w docs/SOURCES.md.
# Pole liveSearch = true oznacza, że host jest dopuszczony do wyszukiwania NA ŻYWO (hosty urzędowe oraz fact-checkerzy
# IFCN/EFCSN; PLAN §3) — z wyjątkiem źródeł tylko przez API pośrednika (fetchMethod: api, np. Demagog przez Google Fact Check
# Tools API). Gałąź live wymaga liveSearch: true. To flaga polityki, nie gwarancja dostępu: serwis może blokować boty (HTTP 403) —
# dostawca wyszukiwania musi wtedy uznać gałąź za niedostępną, a nie obchodzić zabezpieczenie. Pole jest w kontrakcie CatalogSource.
#
# Wpisy bez rekordów w korpusie (recordCount = 0) są w katalogu, bo: (a) źródło jest zablokowane dla botów
# i zostało pominięte (opis w docs/SOURCES.md), albo (b) oczekujemy go w pakiecie organizatora.

- id: sejm-eli
  hosts: [api.sejm.gov.pl]
  publisher: Sejm RP / Dziennik Ustaw i Monitor Polski (API ELI)
  type: pierwotne
  level: 1
  role: tresc
  independenceGroup: dziennik-ustaw
  licence: >-
    Akty normatywne i urzędowe dokumenty publiczne są wyłączone spod ochrony prawa autorskiego
    (art. 4 pkt 1-2 ustawy z 4.02.1994 r. o prawie autorskim i prawach pokrewnych). Teksty ujednolicone
    (Kancelaria Sejmu) mają charakter informacyjny i są oparte wyłącznie na tych aktach.
  fetchMethod: api
  updateFrequency: >-
    przy każdym przebudowaniu korpusu (npm run corpus:build); ELI aktualizuje się na bieżąco po publikacji w Dz.U./M.P.
  qualification: >-
    Dziennik Ustaw i Monitor Polski to urzędowe publikatory aktów prawnych; API ELI Sejmu udostępnia ich
    metadane i teksty (HTML - tekst ogłoszony; PDF - tekst ujednolicony). Źródło pierwotne dla pytań o to,
    co mówi polskie prawo (sankcje, cudzoziemcy, granica, obronność, wybory). Ten sam host (api.sejm.gov.pl) to także
    oficjalne API Sejmu: rekordy o posłach X kadencji i klubach poselskich (zdania wygenerowane z pól API, tag
    "generated-from-data", url = dokładny adres wpisu posła/klubu) oraz rekord o Marszałku Sejmu (podpis pod
    obwieszczeniem Marszałka Sejmu w Dz.U. - dosłowna linia "Marszałek Sejmu: ...").
  exclusion: >-
    Wykluczamy: akty uchylone w całości; fragmenty bez treści normatywnej ("(uchylony)"); teksty ogłoszone
    (pierwotne) aktów, które mają nowszy tekst ujednolicony - zamiast nich używamy tekstu ujednoliconego.
  homepage: https://api.sejm.gov.pl/eli.html
  nonEea: false
  ifcnEfcsn: false
  liveSearch: true

