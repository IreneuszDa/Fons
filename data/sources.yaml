    Do rozstrzygnięcia potrzebne są dowody spełniające wymogi PLAN §4.
  exclusion: >-
    Strony szczegółowe wpisów (/report/...) są chronione wyzwaniem antybotowym (HTTP 403) i NIE są pobierane;
    paginacja (/page/N/) jest zablokowana w robots.txt - bierzemy tylko pierwszą stronę wyników każdego hasła.
