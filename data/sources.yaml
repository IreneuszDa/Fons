  independenceGroup: rzad-rp
  licence: >-
    Informacje urzędowe i komunikaty administracji publicznej. Licencja otwarta nie jest potwierdzona, dlatego
    stosujemy krótki cytat (<= 300 znaków) + link + wskazanie wydawcy; nie powielamy całych tekstów.
