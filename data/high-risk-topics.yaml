# Lista tematów wysokiego ryzyka dla pętli informacji (PLAN §8).
# Własność serwera. Nierozstrzygnięte zgłoszenie z takiego tematu uruchamia alert (webhook wskazany
# przez administratora), nawet gdy zgłosiła je tylko jedna osoba.
#
# Dopasowanie: tekst jest zamieniany na małe litery bez znaków diakrytycznych (ł -> l, ą -> a ...).
# Każde słowo kluczowe to PRZEDROSTEK słowa w tekście (np. "wybor" łapie "wybory", "wyborach",
# "wyborczy"); fraza wielowyrazowa musi wystąpić w kolejności, każdy jej człon jako przedrostek.
# Znak $ na końcu frazy oznacza dokładne słowo (np. "msz$" nie łapie "mszy"). Wpisuj słowa BEZ
# polskich znaków. Unikaj bardzo krótkich przedrostków, które łapią zbyt wiele.
